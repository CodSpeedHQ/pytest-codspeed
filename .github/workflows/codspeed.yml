name: CodSpeed
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14.3"
  SHARDS: 4

permissions:
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  benchmarks:
    strategy:
      fail-fast: false
      matrix:
        shard: [2]
        mode: ["walltime"]
        variant:
          - pr-code
          - pr-code-skip-upload
          - pr-code-verbose-faulthandler
          - master-src
          - master-plugin-py
          - master-tests

    name: "Shard #${{ matrix.shard }} ${{ matrix.variant }}"
    runs-on: ${{ matrix.mode == 'walltime' && 'codspeed-macro' || 'ubuntu-24.04' }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: Apply variant
        run: |
          git fetch -q --depth=1 origin master
          case "${{ matrix.variant }}" in
            master-src) git checkout FETCH_HEAD -- src/pytest_codspeed/plugin.py src/pytest_codspeed/utils.py ;;
            master-plugin-py) git checkout FETCH_HEAD -- src/pytest_codspeed/plugin.py ;;
            master-tests) git checkout FETCH_HEAD -- tests/conftest.py tests/test_pytest_plugin.py ;;
          esac
          git status --short
          if [ "${{ matrix.variant }}" = pr-code-skip-upload ]; then echo "CODSPEED_SKIP_UPLOAD=true" >> "$GITHUB_ENV"; fi
          if [ "${{ matrix.variant }}" = pr-code-verbose-faulthandler ]; then echo "EXTRA_ARGS=-v -o faulthandler_timeout=300" >> "$GITHUB_ENV"; fi
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install local version of pytest-codspeed
        run: |
          sudo apt-get update
          sudo apt-get install valgrind -y
          uv sync --dev
          sudo apt-get remove valgrind -y
      - name: Run benchmarks
        uses: CodSpeedHQ/action@main
        with:
          mode: ${{ matrix.mode }}
          run: uv run pytest tests/benchmarks/ --codspeed ${{ env.EXTRA_ARGS }} --test-group=${{ matrix.shard }} --test-group-count=${{ env.SHARDS }}

  all-checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed."
    needs:
      - benchmarks
